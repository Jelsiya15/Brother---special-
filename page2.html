<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Memories</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        h2 {
            color: #d63384;
            margin-bottom: 20px;
        }
        .photo-container {
            margin-top: 10px;
        }
        .photo-container img {
            width: 100%;
            max-width: 320px;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .quote {
            font-size: 17px;
            margin: 25px auto;
            color: #444;
            font-style: italic;
            line-height: 1.6;
            padding: 0 10px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Our Special Memories ✨</h2>
        
        <div class="photo-container">
            <!-- நீங்கள் அப்லோட் செய்த படம் -->
            <img src="IMG-20260211-WA0001.jpg" alt="Brother and Sister Photo">
        </div>

        <p class="quote">"எத்தனை சண்டைகள் வந்தாலும், தூரம் விலகினாலும் நம் பாசம் என்றுமே குறையாது!"</p>

        <!-- அடுத்த பக்கத்திற்கான லிங்க் -->
        <a href="page3.html" class="btn">Next Page 👉</a>
    </div>

</body>
</html>
