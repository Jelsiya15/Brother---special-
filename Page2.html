<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Memories</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            text-align: center;
            padding: 20px;
        }
        .photos {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .photos img {
            width: 250px;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .quote {
            font-size: 18px;
            margin: 30px auto;
            max-width: 600px;
            color: #333;
            font-style: italic;
        }
        .btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Our Special Memories ✨</h2>
    
    <div class="photos">
        <!-- உங்கள் போட்டோ பெயர்களை இங்கே கொடுங்கள் -->
        <img src="brother.jpg" alt="Brother Photo">
        <img src="sister.jpg" alt="Sister Photo">
    </div>

    <p class="quote">"எத்தனை சண்டைகள் வந்தாலும், தூரம் விலகினாலும் நம் பாசம் என்றுமே குறையாது!"</p>

    <a href="page3.html" class="btn">Next Page</a>

</html>
